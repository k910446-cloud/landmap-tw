name: 測試

# 這個專案最怕的不是當掉，是安靜地算錯 —— 面積少一位數、地號補零補錯、
# 座標偏幾百公尺，畫面上都長得很正常。所以每次推送都跑一次核心計算的測試。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 資料檔很大，測試用不到，只取最新一次提交
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 跑單元測試
        run: python -m unittest discover -s tests -v

      # 產生器要能跑起來 —— 這幾支只讀本地檔案，不連外
      - name: 檢查產生器可執行
        run: |
          python build_static.py
          python -c "import build_laws, build_prices, build_landuse, pdftext, geo, start"
